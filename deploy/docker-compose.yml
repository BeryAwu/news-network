# Production layout: dashboard and public news sites as two processes from one image, behind Caddy.
# Usage (from repo root):  docker compose -f deploy/docker-compose.yml --env-file .env.production up -d --build
services:
  admin:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: ../.env.production
    environment: { APP_MODE: admin }
    mem_limit: 512m
  public:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: ../.env.production
    environment: { APP_MODE: public }
    mem_limit: 512m
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [admin, public]
    ports: ["80:80", "443:443"]
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
